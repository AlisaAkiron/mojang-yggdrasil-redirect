name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Vet, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go generate ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: go
    permissions:
      contents: read
      packages: write
    env:
      # Publish only from main pushes; PRs build (amd64) as validation without pushing.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      # No QEMU needed: the Dockerfile cross-compiles Go on the build platform.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the name -> ghcr.io/alisaakiron/mojang-yggdrasil-redirect
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=1.0.${{ github.run_number }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
